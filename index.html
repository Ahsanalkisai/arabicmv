<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ޢަރަބި ދަސްކުރަމާ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Thaana:wght@400;600;700&display=swap">
<style>
@font-face{
  font-family:"Faruma";
  src:url("./fonts/Faruma.woff2") format("woff2"),
      url("./fonts/Faruma.woff") format("woff");
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#f3f5f1; --surface:#e4efe6; --card:#ffffff; --ink:#15211b; --muted:#66736c;
  --primary:#1f5c45; --on-primary:#ffffff; --accent:#f3e9a8; --on-accent:#3a3a12; --line:#e3e9e4;
  --good:#22a06b; --bad:#d9433b; --shadow:0 1px 2px rgba(31,92,69,.05), 0 4px 16px rgba(31,92,69,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a15; --surface:#1a2b23; --card:#15231c; --ink:#edf2ee; --muted:#9fb0a7;
    --primary:#8fd3b4; --on-primary:#0f1a15; --accent:#4f4a24; --on-accent:#f5efc2; --line:#26382f;
    --good:#5fd39a; --bad:#f08a80; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a15; --surface:#1a2b23; --card:#15231c; --ink:#edf2ee; --muted:#9fb0a7;
  --primary:#8fd3b4; --on-primary:#0f1a15; --accent:#4f4a24; --on-accent:#f5efc2; --line:#26382f;
  --good:#5fd39a; --bad:#f08a80; --shadow:0 1px 2px rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Faruma","Samee Avas Thaana","MV Faseyha","Noto Sans Thaana",sans-serif; font-size:17px; line-height:1.9}
.ar{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif; line-height:1.8; direction:rtl; unicode-bidi:isolate}
.en{font-family:Georgia,"Times New Roman",serif; direction:ltr; unicode-bidi:isolate; line-height:1.4; font-size:1rem; color:var(--muted)}
.dv{direction:rtl; unicode-bidi:isolate}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
.wrap{max-width:600px; margin:0 auto; padding:0 14px 96px}

/* header */
.hdr,.home{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:8px 0 10px}
.ib{width:40px; height:40px; border-radius:50%; background:none; border:0; display:grid; place-items:center; color:var(--primary); padding:0}
.ib:hover{background:var(--surface)}
.hc{text-align:center; min-width:0}
.hs{font-size:.8rem; color:var(--muted); line-height:1.3}
.ht{font-weight:700; color:var(--primary); font-size:1.15rem; line-height:1.5; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ht.ar{font-size:1.45rem}
.hc.one{display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.hc.one .hs{font-size:1rem; color:var(--primary); white-space:nowrap}
.hc.one .ht{flex:1; font-size:1.35rem; text-align:center; color:var(--ink)}
.home .logo{display:grid; place-items:center; color:var(--primary)}
.home .logo .ic{width:28px; height:28px}
.home .ht{font-size:1.7rem}
.home .logo .ic{color:var(--primary)}

/* unit list */
.ulist{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.ucard,.lcard{display:flex; align-items:center; gap:12px; width:100%; text-align:right; background:var(--card); border:0; border-radius:16px; padding:10px 12px; box-shadow:var(--shadow)}
.thumb{width:48px; height:48px; flex:none; display:grid; place-items:center; background:var(--surface); border-radius:14px; color:var(--primary); font-size:1.35rem; font-weight:700}
.ut{flex:1; min-width:0; display:flex; flex-direction:column}
.uk{font-size:.85rem; color:var(--primary); line-height:1.3}
.un{font-size:1.3rem; line-height:1.6; font-weight:700}
.ud{font-size:.85rem; color:var(--muted); line-height:1.5}
.uend{color:var(--muted); display:grid; flex:none}
.ucard .ut{flex-direction:row; align-items:center; justify-content:space-between; gap:8px}
.ucard .un{flex:1; min-width:0}
.ucard .uk{order:2; white-space:nowrap}
.ucard .ut{flex-wrap:wrap}
.ucard .ud{width:100%; order:3}
.ucard.off{box-shadow:none; background:var(--surface); opacity:.6}
.ucard.off .thumb{background:var(--bg); color:var(--muted)}

/* lessons */
.hero{background:linear-gradient(90deg, #f6f1cf 0%, var(--surface) 60%); color:var(--ink); border-radius:18px; padding:14px 18px; margin-bottom:12px; display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; gap:10px; padding:10px 16px}
.hero .hk{font-size:.95rem; color:var(--primary); white-space:nowrap}
.hero .hn{font-size:1.35rem; font-weight:700; line-height:1.6; text-align:center}
.hero .ud{color:inherit; opacity:.85}
.llist{display:grid; gap:10px}
.lcard.cur .lk{background:var(--accent); color:var(--on-accent)}
.lk.ok{background:var(--good); color:#fff}
.lk{width:40px; height:40px; flex:none; border-radius:12px; background:var(--surface); color:var(--primary); display:grid; place-items:center; font-size:1.1rem; font-weight:700}
.lcard .un{font-size:1.5rem; font-weight:400}

/* segmented control */
.seg{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px}
.seg button{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 18px; color:var(--muted); white-space:nowrap; font-size:1rem}
.seg button.on{background:var(--accent); border-color:transparent; color:var(--primary); font-weight:700}
.scope{display:flex; justify-content:flex-end; margin-bottom:8px}
.scope select{width:auto; border-radius:999px; background:var(--card); border:1px solid var(--line); padding:2px 14px; font-size:.95rem}

h2{font-size:1.05rem; margin:16px 0 8px; color:var(--primary)}
.sub{color:var(--muted); margin:0 0 8px; font-size:.95rem}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--primary); color:var(--on-primary); border:0; border-radius:14px; padding:8px 22px; font-weight:600; font-size:1.05rem}
.btn.wide{width:auto; margin:0 auto; display:flex}
.btn.reveal{background:var(--surface); color:var(--primary); border-radius:999px; padding:6px 22px; font-weight:600}
.btn.ghost{background:var(--card); color:var(--primary); border:1px solid var(--line)}
.btn.small{padding:0 12px; font-size:.82rem; font-weight:400}
.btn.danger{background:none; color:var(--bad); border:1px solid var(--bad)}
.card{background:var(--card); border-radius:18px; padding:14px; box-shadow:var(--shadow)}
.empty{background:var(--surface); border-radius:16px; padding:22px 16px; text-align:center; color:var(--muted)}
.count{color:var(--muted); font-size:.92rem}
.tr{display:flex; flex-direction:column; gap:2px; margin-top:4px}
.tr .en{text-align:left}

/* conversation */
.conv{background:var(--card); border-radius:18px; margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow)}
.chead{display:flex; align-items:center; gap:10px; padding:10px 14px 6px}
.chead .count{margin-inline-start:auto}
.chead .ib{width:34px; height:34px; background:var(--surface)}
.chead .pbtn{width:34px; height:34px}
.chead b{color:var(--primary)}
.chead span{font-size:.85rem; color:var(--muted)}
.player{display:flex; align-items:center; gap:10px; margin:2px 12px 8px; background:var(--surface); border-radius:999px; padding:6px 14px}
.pbtn{width:38px; height:38px; border-radius:50%; border:0; background:var(--primary); color:var(--on-primary); color:var(--on-primary); display:grid; place-items:center; flex:none; padding:0}
.pbtn svg{width:14px; height:14px; fill:currentColor}
.plab{font-size:.82rem; line-height:1.4; white-space:nowrap}
.plab small{display:block; color:var(--muted); direction:ltr; text-align:right; font-family:Georgia,serif}
.prog{flex:1; height:4px; background:var(--line); border-radius:2px; overflow:hidden; direction:ltr}
.prog i{display:block; height:100%; width:0; background:var(--primary)}
.auerr{margin:-2px 14px 8px; font-size:.8rem; color:var(--muted)}
.line{display:grid; grid-template-columns:4.6em 1fr 20px; align-items:baseline; gap:6px; width:100%; text-align:right; background:none; border:0; border-top:1px solid var(--line); padding:6px 14px}
.line.on{background:var(--surface)}
.line .who{color:var(--primary); font-size:1.05rem}
.line .say{font-size:1.55rem}
.line .tr{grid-column:1 / -1}
.line .ic,.vcard .ic,.nhead .ic{width:18px; height:18px; color:var(--muted); align-self:center; transition:transform .15s}
.line.on>.ic,.nhead[aria-expanded="true"]>.ic{transform:rotate(-90deg)}

/* vocabulary + class entries */
.vlist{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.vlist li{display:flex}
.vcard{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; width:100%; min-height:84px; text-align:center; background:var(--card); border:0; border-radius:16px; padding:10px 8px; box-shadow:var(--shadow)}
.vcard.on{background:var(--surface)}
.vcard>.ar{font-size:1.75rem; color:var(--primary); line-height:1.5}
.vcard>.ic{display:none}
.vcard .tr{align-items:center; text-align:center}
.vcard .tr .en{text-align:center}
.vcard .forms{justify-content:center}
.forms{display:flex; gap:14px; flex-wrap:wrap; font-size:.82rem; color:var(--muted)}
.forms .ar{font-size:1.15rem; color:var(--ink)}
.tools{display:flex; gap:8px; padding:6px 4px 2px}

/* help */
.note{background:var(--card); border-radius:16px; margin-bottom:8px; overflow:hidden; box-shadow:var(--shadow)}
.nhead{display:flex; justify-content:space-between; align-items:center; width:100%; background:none; border:0; padding:10px 14px; font-weight:700; text-align:right}
.nbody{padding:0 14px 10px}
.nbody p{margin:0 0 6px; font-size:1rem; color:var(--muted)}
.ex{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; border-top:1px solid var(--line); padding:6px 0}
.badge{background:var(--accent); color:var(--on-accent)}
.ex .ar{font-size:1.4rem}
.ex .tr{margin:0}
.tips p{margin:0 0 6px; font-size:1rem}
.tips p:last-child{margin:0}

/* flashcard */
.fc{width:100%; min-height:210px; background:var(--card); border:0; border-radius:18px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:20px; text-align:center; box-shadow:var(--shadow)}
.fc .ar{font-size:clamp(2.4rem,11vw,3.4rem); color:var(--primary)}
.fc .en{font-size:1.15rem; text-align:center}
.fc .dv{font-size:1.25rem}
.fc .hint{font-size:.8rem; color:var(--muted)}
.fc .forms{justify-content:center; margin-top:6px}
.ctrl{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px}
.rb{width:52px; height:42px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--primary); display:grid; place-items:center; padding:0}
.rb.go{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}

/* quiz + speak */
.clabel{display:flex; justify-content:space-between; align-items:center; color:var(--primary); font-weight:700; font-size:1.05rem}
.prompt{text-align:center; margin:2px 0 12px; display:flex; flex-direction:column; align-items:center}
.prompt .ar{font-size:2.1rem}
.prompt .dv{font-size:1.25rem}
.prompt .en{font-size:1rem}
.opts{display:grid; gap:8px}
.opt{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px 12px; text-align:right; display:flex; flex-direction:column}
.opt .en{text-align:left}
.opt.ar{font-size:1.5rem}
.opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 12%, var(--card))}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 10%, var(--card))}
.score{font-size:2.2rem; font-weight:700; color:var(--primary); text-align:center; margin:4px 0}
.model{background:var(--surface); border-radius:16px; padding:10px 14px; margin-top:10px; text-align:center}
.model .ar{font-size:1.9rem; display:block}
.msg{text-align:center; min-height:1.9em; margin:6px 0 0; font-size:.9rem}

/* match + arrange */
.match{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.match .col{display:grid; gap:8px; align-content:start}
.mbtn{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 8px; min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center}
.mbtn.ar{font-size:1.45rem}
.mbtn .en{text-align:center}
.mbtn.sel{border-color:var(--primary); box-shadow:inset 0 0 0 2px var(--primary)}
.mbtn.done{border-color:var(--good); background:var(--surface); color:var(--good)}
.mbtn.wrong{border-color:var(--bad); box-shadow:inset 0 0 0 2px var(--bad)}
.slot{min-height:64px; border-bottom:2px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 0; margin-bottom:10px}
.slot.good{border-bottom-color:var(--good)} .slot.bad{border-bottom-color:var(--bad)}
.bank{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:50px}
.word{background:var(--surface); border:0; border-radius:10px; padding:0 12px; font-size:1.45rem}

/* class */
.chips{display:grid; gap:8px; margin:6px 0}
.chip{display:flex; justify-content:space-between; align-items:center; background:var(--card); border:0; border-radius:14px; padding:8px 14px; box-shadow:var(--shadow); text-align:right}

/* bottom nav */
.nav{position:fixed; bottom:0; left:0; right:0; z-index:5; display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:var(--card); border-radius:22px 22px 0 0; box-shadow:0 -4px 18px rgba(31,92,69,.08); padding:8px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex; flex-direction:column; align-items:center; gap:0; background:none; border:0; border-radius:14px; padding:4px 6px 2px; font-size:.95rem; line-height:1.6; color:var(--muted); white-space:nowrap}
.nav button .ic{width:24px; height:24px}
.nav button .ic{width:22px; height:22px; padding:7px; box-sizing:content-box; border-radius:50%}
.nav button.on{color:var(--primary); font-weight:700}
.nav button.on .ic{background:var(--primary); color:var(--on-primary)}

/* modal + menu */
.veil{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10}
.modal{background:var(--card); width:100%; max-width:460px; max-height:92%; overflow:auto; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.modal h3{margin:0 0 8px}
.menu{display:grid; gap:6px}
.menu button{background:var(--surface); border:0; border-radius:12px; padding:8px 14px; text-align:right; color:var(--primary); font-weight:600}
.menu button.q{background:none; color:var(--muted); font-weight:400; text-align:center}
label{display:block; font-size:.86rem; color:var(--muted); margin-top:8px}
input,select,textarea{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:5px 12px}
input.ar,textarea.ar{font-size:1.35rem}
input.en{text-align:left; font-size:1rem; color:var(--ink)}
.err{color:var(--bad); font-size:.86rem; min-height:1.6em; margin:6px 0 0}

@media (prefers-reduced-motion: no-preference){
  .tr,.model,.nbody{animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0; transform:translateY(-4px)}to{opacity:1; transform:none}}
}

/* tablet + desktop: side rail instead of a stretched phone layout */
@media (min-width:700px){
  .ulist{grid-template-columns:1fr 1fr}
  .vlist{grid-template-columns:repeat(3,1fr)}
  .wrap{max-width:760px; padding-bottom:40px}
  .veil{align-items:center}.modal{border-radius:18px}
}
@media (min-width:900px){
  /* desktop: the four sections sit in a top bar, same position every page */
  body.has-nav .wrap{padding-top:72px}
  .nav{top:0; bottom:auto; left:50%; right:auto; transform:translateX(-50%); width:100%; max-width:760px; border-radius:0 0 22px 22px; box-shadow:0 4px 18px rgba(31,92,69,.08); padding:8px 10px}
  .nav button{flex-direction:row; justify-content:center; gap:8px; padding:6px 18px; font-size:1.05rem}
  .nav button .ic{padding:5px}
  .vlist{grid-template-columns:repeat(4,1fr)}
}


/* Audio files are not included, so hide unavailable audio controls. */
.chead .pbtn,.player,.auerr{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header id="hdr"></header>
  <main id="app"></main>
</div>
<nav class="nav" id="nav" aria-label="ބައިތައް"></nav>
<div id="modalRoot"></div>
<script>
/* ---------- content: Book 1 ---------- */
var UNITS = [
 ["التَّحِيَّةُ وَالتَّعَارُفُ","ސަލާމްކުރުމާއި ދެނެގަތުން"],
 ["الأُسْرَةُ","ޢާއިލާ"],
 ["السَّكَنُ","ދިރިއުޅޭ ތަން"],
 ["الحَيَاةُ اليَوْمِيَّةُ","ދުވަހުގެ ދިރިއުޅުން"],
 ["الطَّعَامُ وَالشَّرَابُ","ކެއުމާއި ބުއިން"],
 ["الصَّلَاةُ","ނަމާދު"],
 ["الدِّرَاسَةُ","ކިޔެވުން"],
 ["العَمَلُ","މަސައްކަތް"],
 ["التَّسَوُّقُ","ބާޒާރުކުރުން"],
 ["الجَوُّ","މޫސުން"],
 ["النَّاسُ وَالأَمَاكِنُ","މީހުންނާއި ތަންތަން"],
 ["الهِوَايَاتُ","ޝައުޤުވެރި ކަންކަން"],
 ["السَّفَرُ","ދަތުރު"],
 ["الحَجُّ وَالعُمْرَةُ","ޙައްޖާއި ޢުމްރާ"],
 ["الصِّحَّةُ","ޞިއްޙަތު"],
 ["العُطْلَةُ","ޗުއްޓީ"]
];
/* In VS Code each unit becomes /data/book1/unitNN.json.
   "audio" is ONE file for the whole conversation. */
var UNIT_DATA = {
 1:{
  lessons:[
   {num:1,ar:"التَّحِيَّةُ",task:"ކްލާހުގެ ކުއްޖަކާ ސަލާމްކޮށް، އޭނާގެ ނަމާއި ޙާލު ޢަރަބިން އަހާ. ދެން ބަދަލުކޮށްލާ."},
   {num:2,ar:"الْجِنْسِيَّةُ",task:"ކްލާހުގެ ކުއްޖަކު ކޮން ޤައުމަކުންތޯ އާއި އޭނާގެ ޤައުމިއްޔަތަކީ ކޮބައިތޯ ޢަރަބިން އަހާ."},
   {num:3,ar:"التَّعَارُفُ",task:"ކްލާހުގެ ކުއްޖަކަށް ތިބާގެ ރަޙްމަތްތެރިއަކު ޢަރަބިން ތަޢާރަފުކޮށްދީ، އޭނާގެ މަސައްކަތްވެސް ބުނެދީ."}

function loadArr(){

var speed = null, speedTimer = null;

    (S.unit || S.cls ? '<button data-a="units">ހުރިހާ ޔުނިޓްތައް</button>' : '')+
    (S.teacher ? '<button data-a="logout">މުދައްރިސް ލޮގްއައުޓް</button>' : '<button data-a="loginOpen">މުދައްރިސް ލޮގިން</button>')+
    '<button class="q" data-a="close">ލައްޕާ</button></div>');
}

/* ---------- modals ---------- */
function closeModal(){ modalRoot.innerHTML = ""; }
function openModal(html){
  modalRoot.innerHTML = '<div class="veil" data-a="veil"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  var f = modalRoot.querySelector("input,select,textarea"); if(f) f.focus();
}
function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
function fail(msg){ var el = document.getElementById("err"); if(el) el.textContent = msg; }
var BTNS = function(action, id){ return '<p class="err" id="err"></p><div class="row"><button class="btn" data-a="'+action+'" data-id="'+(id||"")+'">ސޭވްކުރޭ</button><button class="btn ghost" data-a="close">ކެންސަލްކުރޭ</button></div>'; };
function loginModal(){
  openModal('<h3>މުދައްރިސް ލޮގިން</h3><label for="pw">ޕާސްވޯޑް</label><input id="pw" type="password" dir="ltr" autocomplete="off">'+
    '<p class="err" id="err"></p><div class="row"><button class="btn" data-a="loginDo">ލޮގިންވޭ</button><button class="btn ghost" data-a="close">ކެންސަލްކުރޭ</button></div>');
}
function classModal(c){
  openModal('<h3>'+(c?"ކްލާހުގެ ނަން ބަދަލުކުރޭ":"އާ ކްލާހެއް ހަދާ")+'</h3><label for="cname">ކްލާހުގެ ނަން</label><input id="cname" value="'+esc(c?c.name:"")+'">'+BTNS("classSave", c?c.id:""));
}
function confirmModal(text, action, id){
  openModal('<h3>'+text+'</h3><p class="sub">މި ކަން އަނބުރާ ގެނެވޭކަށް ނެތް</p><div class="row"><button class="btn danger" data-a="'+action+'" data-id="'+(id||"")+'">ޑިލީޓްކުރޭ</button><button class="btn ghost" data-a="close">ކެންސަލްކުރޭ</button></div>');
}
function entryFields(type, e){
  e = e || {}; var x = e.extra || {};
  function inp(id, label, v, cls, dir){ return '<label for="'+id+'">'+label+'</label><input id="'+id+'" class="'+(cls||"")+'" dir="'+(dir||"rtl")+'" value="'+esc(v||"")+'">'; }
  if(type === "tip") return inp("f_dv","ސުރުޚީ (ދިވެހި)",e.dv)+'<label for="f_body">ތަފްޞީލު (ދިވެހި)</label><textarea id="f_body" rows="3">'+esc(x.body||"")+'</textarea>'+
    inp("f_ar","މިސާލު (ޢަރަބި)",e.ar,"ar")+inp("f_en","މިސާލުގެ އިނގިރޭސި މާނަ",e.en,"en","ltr");
  var h = inp("f_ar", type==="verb" ? "މާޟީ (ޢަރަބި)" : type==="noun" ? "މުފްރަދު (ޢަރަބި)" : "ޢަރަބި", e.ar, "ar");
  if(type === "noun") h += inp("f_plural","ޖަމްޢު (ޢަރަބި)",x.plural,"ar");
  if(type === "verb") h += inp("f_present","މުޟާރިޢު (ޢަރަބި)",x.present,"ar")+inp("f_command","އަމުރު (ޢަރަބި)",x.command,"ar");
  return h+inp("f_en","އިނގިރޭސި މާނަ",e.en,"en","ltr")+inp("f_dv","ދިވެހި މާނަ",e.dv);
}
function entryModal(e){
  var type = e ? e.type : S.type;
  openModal('<h3>'+(e?"ބަދަލުކުރޭ":"އިތުރުކުރޭ")+'</h3><label for="f_type">ބާވަތް</label><select id="f_type"'+(e?" disabled":"")+'>'+
    TYPES.map(function(t){ return '<option value="'+t[0]+'"'+(t[0]===type?" selected":"")+'>'+t[1]+'</option>'; }).join("")+'</select>'+
    '<div id="fields">'+entryFields(type, e)+'</div>'+BTNS("entrySave", e?e.id:""));
}
document.addEventListener("change", function(ev){
  if(ev.target.id === "scopeSel"){ S.scope = ev.target.value; initPractice(); render(); }
  if(ev.target.id === "f_type") document.getElementById("fields").innerHTML = entryFields(ev.target.value);
});
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape") closeModal();
  if(ev.key === "Enter" && ev.target.tagName === "INPUT"){ var b = modalRoot.querySelector(".modal .btn"); if(b) b.click(); }
});


/* ---------- actions ---------- */
var A = {
  menu:function(){ menuModal(); return false; },
  units:function(){ closeModal(); stopAudio(); S.cls=false; S.unit=null; S.lesson=null; S.practice=null; window.scrollTo(0,0); },
  unit:function(d){ S.unit=+d.n; S.lesson=null; try{ localStorage.setItem("aby-unit", String(S.unit)); }catch(e){} window.scrollTo(0,0); },
  lessons:function(){ stopAudio(); S.lesson=null; S.review=false; window.scrollTo(0,0); },
  lesson:function(d){
    S.review = d.n==="r"; S.lesson = S.review ? 1 : +d.n; S.dlg=0; S.tab="read"; S.readTab="conv"; S.scope="lesson"; S.open={}; S.sp=0; S.spShown=false; S.last[S.unit]=S.review ? "r" : S.lesson;
    try{ localStorage.setItem("aby-last", JSON.stringify(S.last)); }catch(e){}
    window.scrollTo(0,0);
  },
  tab:function(d){
    stopAudio(); clearInterval(speedTimer); S.tab=d.t;
    if(d.t==="practice") initPractice();
    if(d.t==="speak"){ S.sp=0; S.spShown=false; }
    if(d.t==="help") markDone("help");
    window.scrollTo(0,0);
  },
  clsOpen:function(){ closeModal(); stopAudio(); S.cls=true; S.classId=null; S.practice=null; window.scrollTo(0,0); },
  clsBack:function(){ if(S.practice) S.practice=null; else if(S.classId) S.classId=null; else S.cls=false; },
  readTab:function(d){ S.readTab=d.t; stopAudio(); if(d.t==="vocab") markDone("read"); },
  dlgNext:function(){ stopAudio(); S.dlg++; },
  pracTab:function(d){ S.pracTab=d.t; initPractice(); },
  spTab:function(d){ S.spTab=d.t; S.sp=0; S.spShown=false; },
  line:function(d){ S.open[d.k]=!S.open[d.k]; },
  audio:function(d){
    var c = UNIT_DATA[S.unit].conv[+d.i], key = S.unit+"-"+d.i;
    if(au.key === key && au.playing){ player.pause(); au.playing = false; return; }
    if(au.key !== key || au.err){ au.key = key; au.err = null; player.src = c.audio; }
    au.playing = true;
    var p = player.play();
    if(p && p.catch) p.catch(function(){ au.playing = false; au.err = key; render(); });
  },
  spShow:function(){ S.spShown=true; if(S.sp===spCount()-1) markDone("speak"); },
  spNext:function(){ S.sp=(S.sp+1)%spCount(); S.spShown=false; },
  spPrev:function(){ var n=spCount(); S.sp=(S.sp-1+n)%n; S.spShown=false; },
  fcFlip:function(){ fc.flipped=!fc.flipped; },
  fcNext:function(){ if(S.tab==="practice" && fc.i===fc.items.length-1) markDone("practice"); fc.i=(fc.i+1)%fc.items.length; fc.flipped=false; },
  fcPrev:function(){ fc.i=(fc.i-1+fc.items.length)%fc.items.length; fc.flipped=false; },
  quizPick:function(d){ if(quiz.picked!==null) return; quiz.picked=+d.k; if(quiz.picked===quiz.qs[quiz.i].ans) quiz.score++; },
  quizNext:function(){ quiz.i++; quiz.picked=null; if(S.tab==="practice" && quiz.i >= quiz.qs.length) markDone("practice"); },
  quizRestart:function(){ startQuiz(S.cls ? classItems(S.classId) : inLesson(UNIT_DATA[S.unit].vocab)); },
  matchPick:function(d){
    var i = +d.i; match.wrong = null;
    if(d.side === "L") match.selL = match.selL === i ? null : i; else match.selR = match.selR === i ? null : i;
    if(match.selL !== null && match.selR !== null){
      if(match.selL === match.selR) match.done[match.selL] = true; else match.wrong = [match.selL, match.selR];
      match.selL = match.selR = null;
    }
  },
  speedGo:function(){ speed.started = true; clearInterval(speedTimer); speedTimer = setInterval(speedTick, 1000); },
  speedPick:function(d){
    if(speed.over || speed.q.picked !== null) return;
    speed.q.picked = +d.k; speed.total++; if(speed.q.picked === speed.q.ans) speed.score++;
    render(); setTimeout(function(){ if(speed && !speed.over){ speedQ(); render(); } }, 450); return false;
  },
  speedNew:function(){ startSpeed(inLesson(UNIT_DATA[S.unit].vocab)); },
  matchNew:function(){ startMatch(inLesson(UNIT_DATA[S.unit].vocab)); },
  arrPick:function(d){ arr.picked.push(+d.id); },
  arrBack:function(d){ arr.picked = arr.picked.filter(function(x){ return x !== +d.id; }); },
  arrReset:function(){ arr.picked = []; },
  arrNext:function(){ arr.i = (arr.i+1) % arr.list.length; loadArr(); },
  "class":function(d){ S.classId=d.id; S.type="phrase"; S.practice=null; window.scrollTo(0,0); },
  classList:function(){ S.classId=null; S.practice=null; },
  type:function(d){ S.type=d.t; },
  practice:function(d){ S.practice=d.t||null; var it=classItems(S.classId); if(d.t==="fc") startFc(it); if(d.t==="quiz") startQuiz(it); },
  loginOpen:function(){ loginModal(); return false; },
  loginDo:function(){ if(val("pw")===DEMO_PASSWORD){ S.teacher=true; closeModal(); } else { fail("ޕާސްވޯޑް ރަނގަޅެއް ނޫން"); return false; } },
  logout:function(){ S.teacher=false; closeModal(); },
  close:function(){ closeModal(); return false; },
  veil:function(d,ev){ if(ev.target.classList.contains("veil")) closeModal(); return false; },
  classNew:function(){ classModal(null); return false; },
  classRename:function(){ classModal(store.classes.filter(function(c){ return c.id===S.classId; })[0]); return false; },
  classSave:function(d){
    var name = val("cname"); if(!name){ fail("ކްލާހުގެ ނަން ލިޔޭ"); return false; }
    if(d.id){ store.classes.forEach(function(c){ if(c.id===d.id) c.name=name; }); }
    else { var c={id:uid(), name:name}; store.classes.push(c); S.cls=true; S.classId=c.id; S.type="phrase"; S.practice=null; }
    save(); closeModal();
  },
  classDel:function(){ confirmModal("މި ކްލާހާއި އޭގައިވާ ހުރިހާ އެއްޗެއް ޑިލީޓްކުރަންވީތަ؟","classDelDo"); return false; },
  classDelDo:function(){
    store.entries = store.entries.filter(function(e){ return e.classId!==S.classId; });
    store.classes = store.classes.filter(function(c){ return c.id!==S.classId; });
    save(); closeModal(); S.classId=null;
  },
  entryNew:function(){ entryModal(null); return false; },
  entryEdit:function(d){ entryModal(store.entries.filter(function(e){ return e.id===d.id; })[0]); return false; },
  entrySave:function(d){
    var type = document.getElementById("f_type").value;
    var e = {type:type, ar:val("f_ar"), dv:val("f_dv"), en:val("f_en"), extra:{}};
    if(type==="noun") e.extra.plural = val("f_plural");
    if(type==="verb"){ e.extra.present = val("f_present"); e.extra.command = val("f_command"); }
    if(type==="tip"){ e.extra.body = val("f_body"); if(!e.dv){ fail("ސުރުޚީ ލިޔޭ"); return false; } }
    else if(!e.ar || !e.dv || !e.en){ fail("ޢަރަބި، އިނގިރޭސި އަދި ދިވެހި ތިން ބައި ފުރިހަމަކުރޭ"); return false; }
    if(d.id){ store.entries.forEach(function(x){ if(x.id===d.id){ x.ar=e.ar; x.dv=e.dv; x.en=e.en; x.extra=e.extra; } }); }
    else { e.id=uid(); e.classId=S.classId; store.entries.push(e); S.type=type; }
    save(); closeModal();
  },
  entryDel:function(d){ confirmModal("މި އެއްޗެއް ޑިލީޓްކުރަންވީތަ؟","entryDelDo",d.id); return false; },
  entryDelDo:function(d){ store.entries = store.entries.filter(function(e){ return e.id!==d.id; }); save(); closeModal(); }
};

document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-a]"); if(!t) return;
  var fn = A[t.dataset.a]; if(!fn) return;
  if(fn(t.dataset, ev) !== false) render();
});
render();

</script>
</body>
</html>
